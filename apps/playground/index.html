<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ganttkit: Gantt chart for Vue 3</title>
    <meta name="description" content="Live demo of ganttkit, a Gantt chart for Vue 3 with a headless core and copy-in shadcn-vue components. 1 000 to 50 000 rows, drag and drop, dependencies, zoom." />
    <meta property="og:title" content="ganttkit: Gantt chart for Vue 3" />
    <meta property="og:description" content="Headless core and copy-in shadcn-vue components. Try it with 50 000 rows." />
    <meta property="og:image" content="https://raw.githubusercontent.com/ktimur91/ganttkit/main/docs/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // ?theme=dark|light wins, then the saved choice, then the system setting.
      let theme = new URLSearchParams(location.search).get('theme')
      try {
        theme = theme || localStorage.getItem('theme')
      } catch {}
      if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
