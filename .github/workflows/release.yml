name: Release

# Push a tag like v0.2.0 whose version matches packages/core/package.json.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter ganttkit build
      - run: npm publish --provenance --access public
        working-directory: packages/core
