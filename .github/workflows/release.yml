name: Release

# Push a tag like v0.2.0 whose version matches packages/core/package.json,
# or run it by hand to publish the version currently in packages/core.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # write: to create the GitHub release for the tag.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter ganttkit build
      # Verbose: trusted publishing failures are only explained at this level.
      - run: npm publish --provenance --access public --loglevel verbose
        working-directory: packages/core
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
