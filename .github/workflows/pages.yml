name: Pages

# Publishes the playground as the live demo: https://ktimur91.github.io/ganttkit/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter playground build
        env:
          BASE_PATH: /ganttkit/
          # Cloudflare Web Analytics site for ktimur91.github.io. The token is public, it ends up in the page.
          CF_BEACON_TOKEN: 52a15d87594a4cfcb91771a762371ada
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
